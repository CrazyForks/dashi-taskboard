<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Taskboard</title>
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <span class="logo" aria-hidden="true">✓</span>
        <div>
          <h1>Codex Taskboard</h1>
          <p id="version">正在读取版本…</p>
        </div>
      </header>

      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="status-dot starting"></span>
        <div>
          <h2>启动状态</h2>
          <p id="launcher-message">正在启动任务面板…</p>
        </div>
      </section>

      <section class="update-card" aria-live="polite">
        <h2>软件更新</h2>
        <p id="update-message">启动后将自动检查更新。</p>
      </section>

      <div class="actions">
        <button id="restart-button" class="secondary" type="button">重新启动面板</button>
        <button id="check-button" type="button">检查更新</button>
        <button id="install-button" type="button" hidden>下载并安装</button>
      </div>
    </main>
  </body>
</html>
