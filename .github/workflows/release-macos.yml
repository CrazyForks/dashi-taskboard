name: Release macOS

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build signed universal macOS app
    runs-on: macos-latest
    timeout-minutes: 90
    environment: macos-release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Validate immutable release tag and versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_DELETED: ${{ github.event.deleted }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ "$TAG_CREATED" != "true" || "$TAG_DELETED" == "true" || "$TAG_FORCED" == "true" ]]; then
            echo "发布标签必须是首次创建，不能删除或强制更新。" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{}")"
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "标签提交与当前工作流提交不一致。" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

          REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$REMOTE_TAG_COMMIT" ]]; then
            REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "远程发布标签与当前工作流提交不一致。" >&2
            exit 1
          fi

          TAG_RULE_PROTECTED=false
          while IFS= read -r RULESET_ID; do
            RULESET="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID")"
            if jq -e '
              .target == "tag" and
              .enforcement == "active" and
              ((.bypass_actors // []) | length == 0) and
              ((.conditions.ref_name.include // []) | index("refs/tags/app-v*") != null) and
              ((.rules | map(.type)) | index("update") != null) and
              ((.rules | map(.type)) | index("deletion") != null)
            ' <<< "$RULESET" >/dev/null; then
              TAG_RULE_PROTECTED=true
              break
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/rulesets?targets=tag&per_page=100" --jq '.[].id')
          if [[ "$TAG_RULE_PROTECTED" != "true" ]]; then
            echo "发布前必须启用 app-v* 标签规则：禁止更新、禁止删除，并且不能配置绕过者。" >&2
            exit 1
          fi

          RELEASE_ENVIRONMENT="$(gh api "repos/$GITHUB_REPOSITORY/environments/macos-release")"
          if ! jq -e '
            (.protection_rules // [])
            | any(
              .type == "required_reviewers" and
              .prevent_self_review == true and
              ((.reviewers // []) | length > 0)
            )
          ' <<< "$RELEASE_ENVIRONMENT" >/dev/null; then
            echo "macos-release 环境必须启用必需审核人，并禁止发起人自行审核。" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CARGO_VERSION="$(node -e 'const fs=require("fs"); const source=fs.readFileSync("src-tauri/Cargo.toml","utf8"); console.log(source.match(/^version = "([^"]+)"/m)[1])')"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$PACKAGE_VERSION" != "$CARGO_VERSION" || "$PACKAGE_VERSION" != "$TAURI_VERSION" ]]; then
            echo "package.json、Cargo.toml 和 tauri.conf.json 的版本必须一致。" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "app-v$PACKAGE_VERSION" ]]; then
            echo "发布标签必须与应用版本一致。" >&2
            exit 1
          fi

          RELEASE_CHECK="$RUNNER_TEMP/release-check.json"
          if ! RELEASE_STATUS="$(curl --silent --show-error \
            --output "$RELEASE_CHECK" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"; then
            echo "无法确认 Release 是否存在。" >&2
            exit 1
          fi
          case "$RELEASE_STATUS" in
            404) ;;
            200)
              echo "该标签或版本已存在 Release。" >&2
              exit 1
              ;;
            *)
              echo "查询 Release 失败，HTTP $RELEASE_STATUS。" >&2
              exit 1
              ;;
          esac

          RELEASE_TAGS="$RUNNER_TEMP/release-tags.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RELEASE_TAGS"
          PACKAGE_VERSION="$PACKAGE_VERSION" RELEASE_TAGS="$RELEASE_TAGS" node <<'NODE'
          const fs = require("node:fs");
          const current = process.env.PACKAGE_VERSION.split(".").map(Number);
          const compare = (left, right) => {
            for (let index = 0; index < Math.max(left.length, right.length); index += 1) {
              const difference = (left[index] ?? 0) - (right[index] ?? 0);
              if (difference !== 0) return difference;
            }
            return 0;
          };
          for (const tag of fs.readFileSync(process.env.RELEASE_TAGS, "utf8").split(/\r?\n/)) {
            const match = /^app-v(\d+(?:\.\d+)*)$/.exec(tag);
            if (match && compare(match[1].split(".").map(Number), current) >= 0) {
              console.error(`已有相同或更高版本的 Release：${tag}`);
              process.exit(1);
            }
          }
          NODE
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Prepare universal app resources
        run: npm run app:prepare -- --target universal-apple-darwin

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codex-taskboard-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          APPLE_API_KEY_PATH="$RUNNER_TEMP/app-store-connect.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build unsigned universal App and DMG layout
        run: >-
          CI=true npm run tauri -- build
          --target universal-apple-darwin
          --bundles app,dmg
          --no-sign
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Sign App with separate Node.js policy
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/sign-macos-app.mjs "src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Taskboard.app"

      - name: Notarize and staple App
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Codex Taskboard.app"
          APP_ZIP="$RUNNER_TEMP/Codex.Taskboard.app.zip"
          /usr/bin/ditto -c -k --keepParent --sequesterRsrc "$APP_PATH" "$APP_ZIP"
          xcrun notarytool submit "$APP_ZIP" \
            --key-id "$APPLE_API_KEY" \
            --key "$APPLE_API_KEY_PATH" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple -v "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl -a -t exec -vv "$APP_PATH"

      - name: Create, sign, notarize, and staple DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          APP_NAME="Codex Taskboard.app"
          RAW_DMG_NAME="Codex Taskboard_${PACKAGE_VERSION}_universal.dmg"
          RELEASE_DMG_NAME="Codex.Taskboard_${PACKAGE_VERSION}_universal.dmg"
          rm -f "$BUNDLE_ROOT/dmg/$RAW_DMG_NAME" "$BUNDLE_ROOT/macos/$RAW_DMG_NAME"
          (
            cd "$BUNDLE_ROOT/macos"
            ../dmg/bundle_dmg.sh \
              --volname "Codex Taskboard" \
              --icon "$APP_NAME" 180 170 \
              --app-drop-link 480 170 \
              --window-size 660 400 \
              --hide-extension "$APP_NAME" \
              --volicon ../dmg/icon.icns \
              --skip-jenkins \
              "$RAW_DMG_NAME" "$APP_NAME"
          )
          mv "$BUNDLE_ROOT/macos/$RAW_DMG_NAME" "$BUNDLE_ROOT/dmg/$RELEASE_DMG_NAME"
          DMG_PATH="$BUNDLE_ROOT/dmg/$RELEASE_DMG_NAME"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key-id "$APPLE_API_KEY" \
            --key "$APPLE_API_KEY_PATH" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple -v "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          spctl -a -t open --context context:primary-signature -vv "$DMG_PATH"

      - name: Create signed updater files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          node scripts/create-macos-updater.mjs \
            "$BUNDLE_ROOT/macos/Codex Taskboard.app" \
            "$BUNDLE_ROOT/release" \
            "$RELEASE_TAG"

      - name: Verify signed release artifacts and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          APP_PATH="$BUNDLE_ROOT/macos/Codex Taskboard.app"
          DMG_PATH="$BUNDLE_ROOT/dmg/Codex.Taskboard_${PACKAGE_VERSION}_universal.dmg"
          RELEASE_ROOT="$BUNDLE_ROOT/release"
          npm run app:verify-release -- "$APP_PATH" "$DMG_PATH" "$RELEASE_ROOT" "$RELEASE_TAG"

          REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$REMOTE_TAG_COMMIT" ]]; then
            REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "构建期间远程发布标签发生变化。" >&2
            exit 1
          fi

          RELEASE_CHECK="$RUNNER_TEMP/release-check-before-create.json"
          if ! RELEASE_STATUS="$(curl --silent --show-error \
            --output "$RELEASE_CHECK" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"; then
            echo "无法在上传前确认 Release 是否存在。" >&2
            exit 1
          fi
          if [[ "$RELEASE_STATUS" != "404" ]]; then
            echo "上传前 Release 状态不是 404，HTTP $RELEASE_STATUS。" >&2
            exit 1
          fi

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE_ROOT="src-tauri/target/universal-apple-darwin/release/bundle"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Codex Taskboard $RELEASE_TAG" \
            --notes "macOS universal 安装包。此 Release 是待实机验证的 Draft，验证完成后再发布。" \
            "$BUNDLE_ROOT/dmg/Codex.Taskboard_${PACKAGE_VERSION}_universal.dmg" \
            "$BUNDLE_ROOT/release/Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz" \
            "$BUNDLE_ROOT/release/Codex.Taskboard_${PACKAGE_VERSION}_universal.app.tar.gz.sig" \
            "$BUNDLE_ROOT/release/latest.json"

          REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$REMOTE_TAG_COMMIT" ]]; then
            REMOTE_TAG_COMMIT="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ "$REMOTE_TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "创建 Release 后远程发布标签发生变化。" >&2
            exit 1
          fi

          RELEASE="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft)"
          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg target "$GITHUB_SHA" \
            '.tagName == $tag and .targetCommitish == $target and .isDraft == true' \
            <<< "$RELEASE" >/dev/null; then
            echo "Draft Release 的标签、目标提交或草稿状态不正确。" >&2
            exit 1
          fi

      - name: Remove temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/codex-taskboard-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP/app-store-connect.p8"
