name: Export PR source

on:
  push:
    branches:
      - codex/taskboard-current-snapshot-20260806

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git -czf "$RUNNER_TEMP/pr-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: pr-source-${{ github.sha }}
          path: ${{ runner.temp }}/pr-source.tar.gz
          retention-days: 1
          if-no-files-found: error
